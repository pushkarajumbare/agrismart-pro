services:
  # Node.js Express Backend Service
  - type: web
    name: agrismart-pro-backend
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: PYTHON_API_BASE
        value: https://agrismart-pro-2.onrender.com
      - key: CLIENT_URL
        value: https://agrismart-pro.vercel.app

  # Python FastAPI AI Backend Service
  - type: web
    name: agrismart-pro-2
    env: python
    region: singapore
    plan: free
    rootDir: ai_models
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
